<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Icono de cargando">
  <title>Icono de cargando</title>
  <circle cx="48" cy="48" r="38" fill="none" stroke="#242424" stroke-width="8"/>
  <circle cx="48" cy="48" r="38" fill="none" stroke="#48E5C2" stroke-width="8" stroke-linecap="round" stroke-dasharray="60 180" transform="rotate(-90 48 48)">
    <animateTransform attributeName="transform" type="rotate" from="0 48 48" to="360 48 48" dur="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="48" cy="48" r="22" fill="none" stroke="#87E708" stroke-width="5" stroke-linecap="round" stroke-dasharray="30 110" transform="rotate(90 48 48)">
    <animateTransform attributeName="transform" type="rotate" from="360 48 48" to="0 48 48" dur="1.4s" repeatCount="indefinite"/>
  </circle>
</svg>
